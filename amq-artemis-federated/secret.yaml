# Placeholder credentials -- replace before any non-lab use. This is the broker's
# admin/console user; the federation bridge from the edge authenticates with the same
# credentials (see amq-artemis/entrypoint.sh's FEDERATION_* env vars).
apiVersion: v1
kind: Secret
metadata:
  name: artemis-credentials
  labels:
    app: artemis-federated
type: Opaque
stringData:
  AMQ_USER: admin
  AMQ_PASSWORD: password