apiVersion: v1
kind: Service
metadata:
  name: artemis-federated
  labels:
    app: artemis-federated
spec:
  selector:
    app: artemis-federated
  ports:
    - name: federation-tls
      port: 61617
      targetPort: 61617
    # Console is intentionally NOT exposed via a Route -- an admin/JMX console reachable
    # from the whole network is a meaningfully larger attack surface than this needs.
    # Reach it with `oc port-forward svc/artemis-federated 8161:8161` when needed.
    - name: console
      port: 8161
      targetPort: 8161